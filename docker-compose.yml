services:
  dashboard-puskris:
    container_name: dashboard-puskris
    build:
      context: .
      dockerfile: Dockerfile
      # Hanya variabel publik Next.js (non-secret) yang diteruskan saat build-time.
      # Semua token & kredensial (PUSKRIS_*) disuntikkan HANYA saat runtime via env_file.
      args:
        NEXT_PUBLIC_BYPASS_AUTH: ${NEXT_PUBLIC_BYPASS_AUTH:-true}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_ASSET_PREFIX: ${NEXT_PUBLIC_ASSET_PREFIX:-}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-id}
    image: dashboard-puskris:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3005}:3000"
    extra_hosts:
      - "pusatkrisis.kemkes.go.id:host-gateway"
    # Suntikkan seluruh variabel environment (termasuk secret PUSKRIS_*) saat runtime
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
    # Hardening keamanan container
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
      - /app/.next/cache:size=256M,uid=1001,gid=1001,mode=1770
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
